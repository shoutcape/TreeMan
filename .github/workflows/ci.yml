name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Worktree removal takes a different path on Darwin: restoration falls back to
  # a check before the rename, and cleanup addresses files by name rather than
  # through inherited descriptors. Cross-compilation proves those files compile,
  # not that they behave, and a restore that silently refuses would strand a
  # user's worktree in the cleanup queue. So the unit tests run natively too --
  # only those, because the shell smoke suite and the installer are exercised on
  # the Linux job and would need their own macOS handling to add nothing here.
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Unit tests
        run: go test ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Avoid restoring stale module-cache entries already present on hosted runners.
          cache: false

      - name: Install Fish
        run: sudo apt-get update && sudo apt-get install --yes fish

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Static checks
        run: make lint

      - name: Cross-compile
        # Catches platform-only symbols before GoReleaser meets them at release
        # time. Targets are listed in the Makefile, matching .goreleaser.yml.
        run: make cross

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

      - name: Smoke test
        # The smoke suite exercises fzf-backed shell wrappers, which require a TTY.
        run: env -u CI script -qefc './smoke-test.sh' /dev/null
