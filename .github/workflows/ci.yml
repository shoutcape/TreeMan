name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Avoid restoring stale module-cache entries already present on hosted runners.
          cache: false

      - name: Install Fish
        run: sudo apt-get update && sudo apt-get install --yes fish

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Static checks
        run: make lint

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

      - name: Smoke test
        # The smoke suite exercises fzf-backed shell wrappers, which require a TTY.
        run: env -u CI script -qefc './smoke-test.sh' /dev/null
