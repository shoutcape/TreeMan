version: 2

project_name: treeman

before:
  hooks:
    - go mod tidy

builds:
  - id: treeman
    main: ./cmd/treeman
    binary: treeman
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: treeman
    ids:
      - treeman
    # Matches what install.sh expects: treeman_linux_amd64.tar.gz
    name_template: "treeman_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - none*  # binary only, no extra files

checksum:
  name_template: "treeman_checksums.txt"
  algorithm: sha256

release:
  prerelease: auto

brews:
  - name: treeman
    ids:
      - treeman
    repository:
      owner: shoutcape
      name: homebrew-tap
      token: "{{ .Env.TREEMAN_HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/shoutcape/TreeMan
    description: Git worktree management CLI
    license: MIT
    skip_upload: auto
    dependencies:
      - name: git
    install: |
      bin.install "treeman"
    test: |
      system "#{bin}/treeman", "version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
