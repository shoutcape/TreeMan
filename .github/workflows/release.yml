name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Queue merged PRs so each release calculates a distinct next patch version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Release tokens cannot write to the Actions cache.
          cache: false

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Static checks
        run: make lint

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

      - name: Smoke test
        run: ./smoke-test.sh

      - name: Create patch tag
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | { read -r tag; printf '%s' "$tag"; })
          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected the latest release tag to use vMAJOR.MINOR.PATCH, got: ${latest_tag:-none}" >&2
            exit 1
          fi

          next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          git push origin "$next_tag"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
